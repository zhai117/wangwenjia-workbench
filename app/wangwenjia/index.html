<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>王文嘉 · 考研学习进度台</title>
<style>
  :root{
    --paper:#F4F1EA; --ink:#20303D; --clay:#B05A33; --muted:#888780;
    --green:#639922; --amber:#EF9F27; --red:#E24B4A; --line:#D3D1C7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,"Microsoft YaHei",sans-serif; background:var(--paper); color:var(--ink); font-size:14px; line-height:1.6; padding:14px; max-width:720px; margin:0 auto;}
  h1{font-size:18px; margin:0;}
  .top{display:flex; justify-content:space-between; align-items:center; background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px;}
  .top .d{font-size:12px; color:var(--muted);}
  .top .num{font-size:26px; font-weight:600; line-height:1.1;}
  .badge{background:var(--clay); color:#fff; padding:7px 14px; border-radius:20px; font-size:13px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px;}
  .card h2{font-size:15px; margin:0 0 12px;}
  .row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid #F1EFE8;}
  .row:last-child{border-bottom:none;}
  .sub-name{flex:1; font-size:14px;}
  .dot{width:10px; height:10px; border-radius:50%; flex:none;}
  .hinput{width:64px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; font-size:14px; text-align:center;}
  .chk{width:20px; height:20px; flex:none;}
  .lights{display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid #F1EFE8;}
  .lights:last-child{border-bottom:none;}
  /* 状态灯 v2：每周 7 格日历（周一~周日），打了卡亮一格 */
  .lights-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #F1EFE8;}
  .lights-row:last-child{border-bottom:none;}
  .lights-name{flex:none; width:60px; font-size:13px;}
  .lights-grid{display:flex; gap:4px; flex:1; justify-content:flex-start;}
  .grid-cell{width:18px; height:18px; border-radius:4px; border:1px solid var(--line); background:#fff; box-sizing:border-box;}
  .grid-cell.done{background:var(--clay); border-color:var(--clay);}
  .grid-cell.future{border-color:#eee; background:transparent;}
  .grid-cell.today{outline:2px solid var(--ink); outline-offset:-1px;}
  .lights-frac{flex:none; font-size:12px; color:var(--muted); width:34px; text-align:right; font-variant-numeric:tabular-nums;}
  .bar{height:8px; background:#F1EFE8; border-radius:6px; overflow:hidden; margin:6px 0 2px;}
  .bar>i{display:block; height:8px; background:var(--clay); border-radius:6px;}
  .wk-tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:6px;}
  .wk-tabs button{flex:none; border:1px solid var(--line); background:#fff; border-radius:16px; padding:5px 12px; font-size:13px; color:var(--ink);}
  .wk-tabs button.on{background:var(--clay); color:#fff; border-color:var(--clay);}
  .targets{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:4px;}
  .targets .tg{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:8px 10px;}
  .targets .tg .n{font-size:12px; color:var(--muted);}
  .targets .tg .v{font-size:20px; font-weight:700; color:var(--clay); line-height:1.1;}
  .targets .tg.total{border-color:var(--clay); background:#fff;}
  .sub-h{font-size:13px; font-weight:600; color:var(--ink); margin:2px 0 6px;}
  .exam-row{display:grid; grid-template-columns:repeat(2,1fr); gap:6px;}
  .exam-row label{display:flex; flex-direction:column; font-size:12px; color:var(--muted);}
  .exam-row input{margin-top:3px; padding:4px 6px; border:1px solid var(--line); border-radius:6px; font-size:14px; width:100%; box-sizing:border-box;}
  .tl{display:flex; flex-direction:column; gap:5px; margin-top:2px;}
  .tl .row{display:flex; align-items:center; justify-content:space-between; padding:5px 9px; border-radius:8px; background:var(--paper); border:1px solid var(--line); font-size:13px;}
  .tl .row .nm{color:var(--ink); font-weight:500;}
  .tl .row .meta{display:flex; align-items:center; gap:8px;}
  .tl .row .dt{color:var(--muted); font-size:12px;}
  .tl .row .cd{font-size:11px; padding:1px 8px; border-radius:10px; background:#eee; color:var(--muted); white-space:nowrap;}
  .tl .row.next{border-color:var(--clay); background:#fff;}
  .tl .row.next .cd{background:var(--clay); color:#fff;}
  .tl .row.past{opacity:.45;}
  .tl .row.past .cd{background:#ccc; color:#fff;}
  .task{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid #F1EFE8; font-size:13px;}
  .task:last-child{border-bottom:none;}
  .task input[type=checkbox]{margin:0; flex:none; width:18px; height:18px; accent-color:var(--clay);}
  .task .tk-text{flex:1; min-width:0; border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-size:13px; font-family:inherit; color:var(--ink); background:#FAF9F4;}
  .task .tk-text:focus{outline:none; border-color:var(--clay); background:#fff;}
  .task.done .tk-text{color:var(--muted); text-decoration:line-through;}
  .task .tk-del{flex:none; width:24px; height:24px; border:none; background:transparent; color:var(--muted); font-size:18px; line-height:1; cursor:pointer; padding:0;}
  .task .tk-del:hover{color:var(--red);}
  .wk-foot{display:flex; gap:10px; margin-top:10px;}
  .wk-foot button{flex:none; border:1px solid var(--clay); background:#fff; color:var(--clay); border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer; font-family:inherit;}
  .wk-foot button:active{background:var(--clay); color:#fff;}
  .btn{display:block; width:100%; border:1px solid var(--clay); background:var(--clay); color:#fff; border-radius:10px; padding:12px; font-size:15px; margin-top:6px;}
  .btn.ghost{background:#fff; color:var(--clay);}
  .tip{font-size:12px; color:var(--muted); margin-top:10px;}
  .save-ok{color:var(--green); font-size:13px; height:18px; margin-top:6px;}
  /* ---- 每日笔记 + 图片上传 ---- */
  .subj-block{padding:8px 0; border-bottom:1px solid #F1EFE8;}
  .subj-block:last-of-type{border-bottom:none;}
  .subj-block .row{padding:0; border-bottom:none;}
  .sub-note{width:100%; min-height:30px; max-height:160px; margin-top:6px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; font-size:12px; box-sizing:border-box; resize:vertical; font-family:inherit; color:var(--ink); background:#FAF9F4; line-height:1.5;}
  .sub-note:focus{outline:none; border-color:var(--clay); background:#fff;}
  .sub-note::placeholder{color:var(--muted);}
  .sub-cum{font-size:12px;color:var(--muted);margin-top:5px;text-align:right;}
  .sub-cum b{color:var(--clay);font-size:13px;}
  .sub-cum .t{color:var(--ink);}
  .upload-zone{margin-top:12px; padding:14px; border:1px dashed var(--line); border-radius:10px; background:#FAF9F4; text-align:center;}
  .up-label{font-size:13px; color:var(--muted); margin-bottom:10px;}
  .up-btn{display:inline-block; padding:9px 22px; border:1px solid var(--clay); color:var(--clay); background:#fff; border-radius:8px; font-size:13px; cursor:pointer; user-select:none; -webkit-user-select:none;}
  .up-btn:active{background:var(--clay); color:#fff;}
  .thumbs{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; justify-content:flex-start;}
  .thumb{position:relative; width:96px; height:96px; border-radius:8px; overflow:hidden; border:1px solid var(--line); background:#fff; flex:none;}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb .del{position:absolute; top:3px; right:3px; width:22px; height:22px; border-radius:50%; background:rgba(0,0,0,.6); color:#fff; border:none; font-size:14px; line-height:1; cursor:pointer; padding:0; font-family:inherit;}
  /* ---- 分数预估 ---- */
  #lightsReview .sub-note{margin-top:6px;}
  .pr-row{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid #F1EFE8;}
  .pr-row:last-child{border-bottom:none;}
  .pr-name{flex:none; width:64px; font-size:13px; font-weight:500;}
  .pr-score{flex:none; width:40px; font-size:19px; font-weight:700; text-align:right; color:var(--ink); font-variant-numeric:tabular-nums;}
  .pr-up{flex:none; width:46px; font-size:12px; color:var(--green); text-align:center;}
  .pr-down{flex:none; width:46px; font-size:12px; color:var(--red); text-align:center;}
  .pr-prob{flex:none; width:44px; font-size:17px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums;}
  .pr-tag{flex:none; width:42px; text-align:center; font-size:12px; padding:2px 0; border-radius:10px;}
  .pr-tag.ok{background:rgba(99,153,34,.15); color:var(--green);}
  .pr-tag.warn{background:rgba(239,159,39,.18); color:var(--amber);}
  .pr-tag.bad{background:rgba(226,75,74,.15); color:var(--red);}
  .pr-placeholder{flex:1; font-size:12px; color:var(--muted);}
  .pr-empty{font-size:13px; color:var(--muted); line-height:1.7; padding:6px 0;}
  .pr-total{border-top:2px solid var(--line); margin-top:4px; font-weight:500;}
</style>
</head>

// 写入（按访问码；老师只读返回 teacher_readonly）
function syncToSupabase(date, rec){
  if (SUPABASE_URL.indexOf("YOUR_") === 0) return;
  if(READONLY()) return;
  const num = function(s){ return (s !== "" && s != null) ? parseFloat(s) : null; };
  const str = function(s){ return (s != null && s !== "") ? String(s) : null; };
  const row = {
    date: date, student: me.student_id,
    p1_hours: num(rec.p1 && rec.p1.hours), p1_done: !!(rec.p1 && rec.p1.done), p1_note: str(rec.p1 && rec.p1.note),
    p2_hours: num(rec.p2 && rec.p2.hours), p2_done: !!(rec.p2 && rec.p2.done), p2_note: str(rec.p2 && rec.p2.note),
    en_hours: num(rec.en && rec.en.hours), en_done: !!(rec.en && rec.en.done), en_note: str(rec.en && rec.en.note),
    pol_hours: num(rec.pol && rec.pol.hours), pol_done: !!(rec.pol && rec.pol.done), pol_note: str(rec.pol && rec.pol.note),
    images: (rec.images && rec.images.length) ? rec.images : []
  };
  const wk = WEEKS[curWeekIdx] ? WEEKS[curWeekIdx].id : "";
  const payload = D.weekly[wk] || {};
  const body = (me.mode === "modern")
    ? { p_access_code: me.code, p_checkin: row, p_weekly: { wk: wk, payload: payload } }
    : { p_write_pwd: WRITE_PWD, p_checkin: row, p_weekly: { wk: wk, payload: payload } };
  rpc("save_wangwenjia", body).then(function(j){ if(j && j.error) console.warn("sync rejected:", j.error); });
}

function escHtml(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escAttr(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
// 某科目从首次记录到今天累计学习的小时数（跨所有日期求和）
function cumHours(key){
  let total = 0;
  for(const d in D.checkins){
    const r = D.checkins[d] && D.checkins[d][key];
    if(r && r.hours){ total += parseFloat(r.hours) || 0; }
  }
  return total;
}
// 累计记录天数（任意科目有时长或勾选即算一天）
function cumDays(){
  let n = 0;
  for(const d in D.checkins){
    const c = D.checkins[d] || {};
    const any = ["p1","p2","en","pol"].some(function(k){
      const r = c[k]; return r && (r.hours || r.done);
    });
    if(any) n++;
  }
  return n;
}

// 压缩到 1200px 宽、JPEG 0.7，控制 localStorage 不爆
function compressImage(file, maxW, quality){
  maxW = maxW || 1200; quality = quality == null ? 0.7 : quality;
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        const ratio = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * ratio);
        const h = Math.round(img.height * ratio);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = function(){ reject(new Error("图片解码失败")); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ reject(new Error("文件读取失败")); };
    reader.readAsDataURL(file);
  });
}
// images 元素兼容两种格式：新 {full,thumb} / 老 "dataURL字符串"
function imgFull(it){ return (it && typeof it === "object") ? it.full : it; }
function imgThumb(it){ return (it && typeof it === "object") ? (it.thumb || it.full) : it; }
function renderImages(){
  const rec = D.checkins[curDate] || {};
  const imgs = rec.images || [];
  const box = document.getElementById("thumbs");
  if(!box) return;
  box.innerHTML = imgs.map(function(it, i){
    return '<div class="thumb" data-idx="'+i+'">'+
      '<img src="'+imgThumb(it)+'" alt="笔记">'+
      '<button class="del" data-del="'+i+'" type="button" aria-label="删除">×</button>'+
    '</div>';
  }).join("");
  box.querySelectorAll(".del").forEach(function(b){
    b.addEventListener("click", function(e){
      e.stopPropagation();
      const i = +this.getAttribute("data-del");
      const rec = D.checkins[curDate] || {};
      rec.images = rec.images || [];
      rec.images.splice(i, 1);
      D.checkins[curDate] = rec;
      save(D);
      renderImages();
    });
  });
  // 点缩略图看大图
  box.querySelectorAll(".thumb").forEach(function(t){
    t.addEventListener("click", function(){
      const i = +this.getAttribute("data-idx");
      const src = imgFull(imgs[i]);
      if(src) showLightbox(src);
    });
  });
}

document.getElementById("upInput").addEventListener("change", async function(e){
  if(READONLY()) return;
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  try{
    // 原图 1200px 存本地+云端；缩略图 240px 专供微信推送（小才塞得进推送）
    const full  = await compressImage(f, 1200, 0.7);
    const thumb = await compressImage(f, 240, 0.6);
    const rec = D.checkins[curDate] || {};
    rec.images = rec.images || [];
    if(rec.images.length >= 3) rec.images.shift();   // 最多 3 张，最老的让位
    rec.images.push({ full: full, thumb: thumb });
    D.checkins[curDate] = rec;
    save(D);
    renderImages();
  }catch(err){
    console.warn("upload fail:", err);
    alert("图片处理失败：" + (err && err.message || "未知错误"));
  }finally{
    e.target.value = "";  // 允许重新选同一张
  }
});

// ---------- 状态灯 ----------
function weekOf(dateStr){
  for(let i=0;i<WEEKS.length;i++){
    const w = WEEKS[i];
    const range = w.label.match(/(\d{1,2})\/(\d{1,2})-(\d{1,2})\/(\d{1,2})/);
    if(range){
      const y = 2026, m1=+range[1], d1=+range[2], m2=+range[3], d2=+range[4];
      const s = new Date(y+"-"+String(m1).padStart(2,"0")+"-"+String(d1).padStart(2,"0")+"T00:00:00");
      const e = new Date(y+"-"+String(m2).padStart(2,"0")+"-"+String(d2).padStart(2,"0")+"T00:00:00");
      const d = new Date(dateStr+"T00:00:00");
      if(d>=s && d<=e) return i;
    }
  }
  return -1;
}
function renderLights(){
  const box = document.getElementById("lights");
  // 本周(周一~周日)基于 curDate 算（用 curDate 而非 new Date()，与页面查看日期一致，回看历史也正确）
  const cur = new Date(curDate + "T00:00:00");
  const dow = (cur.getDay() + 6) % 7;   // 0=周一, 6=周日
  const monday = new Date(cur); monday.setDate(cur.getDate() - dow);
  const fmt = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const todayStr = curDate;
  const weekDates = [];
  for (let i=0; i<7; i++){
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    weekDates.push(fmt(d));
  }
  // 渲染：每科一行 = 名称 + 7格 + 分数 X/7
  let html = "";
  for (const s of SUBJECTS){
    let done = 0;
    const cells = weekDates.map(function(d){
      const r = (D.checkins[d] || {})[s.key] || {};
      const isDone = r.done || (r.hours && r.hours > 0);
      if (isDone) done++;
      const isFuture = d > todayStr;
      const isToday = d === todayStr;
      const cls = "grid-cell" + (isFuture ? " future" : (isDone ? " done" : "")) + (isToday ? " today" : "");
      const tip = s.name + " · " + d + (isFuture ? "（未到）" : (isDone ? "（已记录）" : "（未记录）"));
      return '<span class="'+cls+'" title="'+tip+'"></span>';
    }).join("");
    html += '<div class="lights-row"><span class="lights-name">'+s.name+'</span><div class="lights-grid">'+cells+'</div><span class="lights-frac">'+done+'/7</span></div>';
  }
  box.innerHTML = html;
  // 每周复盘（接在状态灯最后一行，与周验收清单同一周 curWeekIdx）
  const revBox = document.getElementById("lightsReview");
  if(revBox){
    const wk = WEEKS[curWeekIdx];
    const review = (D.weekly[wk.id] || {}).review || "";
    revBox.innerHTML = '<div class="sub-h" style="margin-top:10px;">本周复盘 · '+wk.label.split(" ")[0]+'</div>'+
      '<textarea class="sub-note" placeholder="本周得失、卡点、下周调整……">'+escHtml(review)+'</textarea>';
    const ta = revBox.querySelector("textarea");
    if(ta) ta.addEventListener("input", function(){
      D.weekly[wk.id] = D.weekly[wk.id] || {};
      D.weekly[wk.id].review = this.value;
      save(D); syncWeeklyNow();
    });
  }
}

// ---------- 周清单 ----------
function renderTabs(){
  const tabs = document.getElementById("wkTabs");
  tabs.innerHTML = "";
  WEEKS.forEach((w,i)=>{
    const b = document.createElement("button");
    b.textContent = w.label.split(" ")[0];
    if(i===curWeekIdx) b.className = "on";
    b.onclick = ()=>{ curWeekIdx = i; renderTabs(); renderTasks(); renderExtra(); renderLights(); };
    tabs.appendChild(b);
  });
}
// 空周自动带出当周 base 底稿（每周一打开即见；已存在则不覆盖，尊重学生改动）
function ensureWeek(wk){
  const w = D.weekly[wk.id];
  if(!w || !w.tasks){
    D.weekly[wk.id] = D.weekly[wk.id] || {};
    D.weekly[wk.id].tasks = (wk.base||[]).map(function(t){ return {text:t, done:false}; });
    save(D); syncWeeklyNow();
  }
  return D.weekly[wk.id];
}
function renderTasks(){
  const wk = WEEKS[curWeekIdx];
  const w = ensureWeek(wk);
  const tasks = w.tasks || [];
  const box = document.getElementById("wkTasks");
  box.innerHTML = "";
  tasks.forEach(function(t, i){
    const div = document.createElement("div");
    div.className = "task" + (t.done ? " done" : "");
    div.innerHTML =
      '<input type="checkbox" '+(t.done?"checked":"")+' data-i="'+i+'">'+
      '<input type="text" class="tk-text" data-i="'+i+'" value="'+escAttr(t.text||"")+'">'+
      '<button type="button" class="tk-del" data-i="'+i+'" aria-label="删除">×</button>';
    box.appendChild(div);
  });
  const total = tasks.length, checked = tasks.filter(function(t){ return t.done; }).length;
  const pct = total ? Math.round(checked/total*100) : 0;
  document.getElementById("wkLabel").textContent = wk.label;
  document.getElementById("wkPct").textContent = "完成 "+checked+"/"+total;
  document.getElementById("wkBar").style.width = pct+"%";
  // 勾选
  box.querySelectorAll('input[type="checkbox"]').forEach(function(cb){
    cb.addEventListener("change", function(){
      const i = +this.dataset.i;
      D.weekly[wk.id].tasks[i].done = this.checked;
      save(D); syncWeeklyNow(); renderTasks();
    });
  });
  // 改文字（不重渲染，避免丢焦点）
  box.querySelectorAll('.tk-text').forEach(function(inp){
    inp.addEventListener("input", function(){
      const i = +this.dataset.i;
      D.weekly[wk.id].tasks[i].text = this.value;
      save(D); syncWeeklyNow();
    });
  });
  // 删除
  box.querySelectorAll('.tk-del').forEach(function(b){
    b.addEventListener("click", function(){
      const i = +this.dataset.i;
      D.weekly[wk.id].tasks.splice(i, 1);
      save(D); syncWeeklyNow(); renderTasks();
    });
  });
  // 添加 / 恢复推荐
  const foot = document.getElementById("wkFoot");
  if(foot){
    foot.innerHTML = '<button type="button" class="tk-add">+ 添加任务</button>'+
                     '<button type="button" class="tk-reset">↺ 恢复推荐</button>';
    foot.querySelector('.tk-add').addEventListener("click", function(){
      D.weekly[wk.id].tasks = D.weekly[wk.id].tasks || [];
      D.weekly[wk.id].tasks.push({text:"", done:false});
      save(D); syncWeeklyNow(); renderTasks();
      const ins = box.querySelectorAll('.tk-text');
      if(ins.length) ins[ins.length-1].focus();
    });
    foot.querySelector('.tk-reset').addEventListener("click", function(){
      D.weekly[wk.id].tasks = (wk.base||[]).map(function(t){ return {text:t, done:false}; });
      save(D); syncWeeklyNow(); renderTasks();
    });
  }
}
// 目标卡（只列各科分数目标，院校方向不显示）
function renderTargets(){
  const box = document.getElementById("targets");
  if(!box) return;
  const items = SUBJECTS.map(function(s){ return { name:s.name, t:TARGETS[s.key] }; });
  items.push({ name:"总分", t:TARGETS.total, total:true });
  box.innerHTML = items.map(function(it){
    return '<div class="tg'+(it.total?' total':'')+'">'+
      '<div class="n">'+it.name+'</div>'+
      '<div class="v">'+it.t+'</div></div>';
  }).join("");
}
// 模考/真题成绩 + 每周复盘（独立于 checklist，切周/初始化才重建，避免输入丢焦点）
function renderExtra(){
  const wk = WEEKS[curWeekIdx];
  const box = document.getElementById("wkExtra");
  if(!box) return;
  const w = D.weekly[wk.id] || {};
  const ex = w.exams || {};
  box.innerHTML =
    '<div class="sub-h">本周模考 / 真题成绩</div>'+
    '<div class="exam-row">'+
      SUBJECTS.map(function(s){
        const v = (ex[s.key]!=null) ? ex[s.key] : '';
        return '<label>'+s.name+'<input type="number" min="0" inputmode="numeric" data-ex="'+s.key+'" value="'+v+'"></label>';
      }).join('')+
    '</div>'+
    '<div class="tip">仅在做了模考 / 真题的当周填写；留空 = 未考。填完自动存云端。</div>';
  box.querySelectorAll('input[data-ex]').forEach(function(inp){
    inp.addEventListener('input', function(){
      const k = this.getAttribute('data-ex');
      D.weekly[wk.id] = D.weekly[wk.id] || {};
      D.weekly[wk.id].exams = D.weekly[wk.id].exams || {};
      const val = this.value === '' ? null : (parseFloat(this.value) || 0);
      if(val===null) delete D.weekly[wk.id].exams[k]; else D.weekly[wk.id].exams[k] = val;
      save(D); syncWeeklyNow();
    });
  });
}

// ---------- 分数预估（对数学习曲线 + 蒙特卡洛） ----------
const MAXES = { p1:150, p2:150, en:100, pol:100 };
// 截至某日期（含）某科目累计学习小时
function cumHoursUpTo(key, dateStr){
  let t = 0;
  for(const d in D.checkins){ if(d <= dateStr){ const r = D.checkins[d] && D.checkins[d][key]; if(r && r.hours) t += parseFloat(r.hours)||0; } }
  return t;
}
// 周标签里的结束日期 YYYY-MM-DD
function weekEndDate(wk){
  const m = wk.label.match(/(\d{1,2})\/(\d{1,2})-(\d{1,2})\/(\d{1,2})/);
  if(!m) return null;
  return "2026-"+String(+m[3]).padStart(2,'0')+"-"+String(+m[4]).padStart(2,'0');
}
// 收集某科目所有模考点 {h:累计小时, s:分数}
function getMocks(key){
  const pts = [];
  for(const wk of WEEKS){
    const w = D.weekly[wk.id];
    if(w && w.exams && w.exams[key] != null){
      const h = cumHoursUpTo(key, weekEndDate(wk));
      pts.push({ h:h, s:w.exams[key] });
    }
  }
  return pts;
}
// 稳定随机（mulberry32），让概率不每次跳动
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function gaussR(rng){ let u=0,v=0; while(u===0)u=rng(); while(v===0)v=rng(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
// 对数最小二乘拟合 s = a + b*ln(1+h)
function logFit(pts){
  const X = pts.map(p=>Math.log(1+Math.max(0,p.h)));
  const Y = pts.map(p=>p.s);
  const n = X.length; let sx=0,sy=0,sxx=0,sxy=0;
  for(let i=0;i<n;i++){ sx+=X[i]; sy+=Y[i]; sxx+=X[i]*X[i]; sxy+=X[i]*Y[i]; }
  const den = n*sxx - sx*sx;
  const b = den!==0 ? (n*sxy - sx*sy)/den : 0;
  const a = (sy - b*sx)/n;
  return {a,b};
}
// 预计考前该科累计小时（按目前日均节奏外推）
function projectHours(key){
  const cur = cumHours(key);
  let first=null;
  for(const d in D.checkins){ const c=D.checkins[d]||{}; if(["p1","p2","en","pol"].some(k=>c[k]&&(c[k].hours||c[k].done))){ if(first===null||d<first) first=d; } }
  const today = curDate;
  let daysSince = 1;
  if(first){ daysSince = Math.max(1, Math.round((new Date(today+"T00:00:00") - new Date(first+"T00:00:00"))/86400000)+1); }
  const daily = cur>0 ? cur/daysSince : 0;
  const daysLeft = Math.max(0, Math.ceil((new Date(EXAM+"T00:00:00") - new Date(today+"T00:00:00"))/86400000));
  return cur + daysLeft*daily;
}
// 单科预估 + 达标概率（蒙特卡洛 3000 次）
function predictSubject(key){
  const pts = getMocks(key);
  if(pts.length < 2) return { insufficient:true };
  const fit = logFit(pts);
  const finalH = projectHours(key);
  const max = MAXES[key];
  let point = fit.a + fit.b*Math.log(1+Math.max(0,finalH));
  point = Math.min(max, Math.max(0, point));
  let seed = 0; pts.forEach(p=>{ seed += Math.round(p.h*7) + p.s*13; });
  const rng = mulberry32(seed|0 || 1);
  const N=3000, sigma=5; let hit=0;
  for(let i=0;i<N;i++){
    const effH = finalH*(1+gaussR(rng)*0.15);
    const noise = gaussR(rng)*sigma;
    let s = fit.a + fit.b*Math.log(1+Math.max(0,effH)) + noise;
    s = Math.min(max, Math.max(0, s));
    if(s >= TARGETS[key]) hit++;
  }
  return { insufficient:false, point:point, gap:point-TARGETS[key], prob:hit/N, pts:pts };
}
// 迷你学习曲线（橙点=模考实测，黑方块=预测点）
function predictSvg(p){
  const W=130,H=38,pad=6;
  const vals = p.pts.map(x=>x.s).concat([p.point]);
  let mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  if(mx-mn < 10){ mn-=5; mx+=5; }
  const n=p.pts.length;
  const xAt = i => pad + (W-2*pad)*(i/n);
  const yAt = v => (H-pad) - (H-2*pad)*((v-mn)/((mx-mn)||1));
  let ptsStr = p.pts.map((x,i)=>xAt(i).toFixed(1)+','+yAt(x.s).toFixed(1)).join(' ');
  ptsStr += ' '+xAt(n).toFixed(1)+','+yAt(p.point).toFixed(1);
  const dots = p.pts.map((x,i)=>'<circle cx="'+xAt(i).toFixed(1)+'" cy="'+yAt(x.s).toFixed(1)+'" r="3" fill="#B05A33"/>').join('');
  const sq = '<rect x="'+(xAt(n)-3.5).toFixed(1)+'" y="'+(yAt(p.point)-3.5).toFixed(1)+'" width="7" height="7" fill="#20303D"/>';
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="flex:none"><polyline points="'+ptsStr+'" fill="none" stroke="#888780" stroke-width="1.5"/>'+dots+sq+'</svg>';
}
function renderPredict(){
  const box = document.getElementById("predict");
  if(!box) return;
  const preds = SUBJECTS.map(s=>({s:s, p:predictSubject(s.key)}));
  const sufficient = preds.filter(x=>!x.p.insufficient);
  if(sufficient.length === 0){
    box.innerHTML = '<div class="pr-empty">暂无足够模考数据（每科需 ≥2 次模考）。录入后自动显示预估。<br>在「周验收清单」对应周填写模考成绩即可。</div>';
    return;
  }
  let totP=0, totGap=0, totProb=0;
  const rows = preds.map(function(x){
    const s=x.s, p=x.p;
    if(p.insufficient){
      return '<div class="pr-row"><span class="pr-name">'+s.name+'</span><span class="pr-placeholder">需 ≥2 次模考</span><span class="pr-prob">--</span></div>';
    }
    totP+=p.point; totGap+=p.gap; totProb+=p.prob;
    const gapTxt = p.gap>=0 ? '<span class="pr-up">超'+p.gap.toFixed(0)+'</span>' : '<span class="pr-down">差'+(-p.gap).toFixed(0)+'</span>';
    let tag,cls; if(p.prob>=0.8){ tag='高'; cls='ok'; } else if(p.prob>=0.5){ tag='临界'; cls='warn'; } else { tag='危险'; cls='bad'; }
    return '<div class="pr-row">'+
      '<span class="pr-name">'+s.name+'</span>'+
      '<span class="pr-score">'+p.point.toFixed(0)+'</span>'+
      gapTxt+
      predictSvg(p)+
      '<span class="pr-prob">'+(p.prob*100).toFixed(0)+'%</span>'+
      '<span class="pr-tag '+cls+'">'+tag+'</span></div>';
  }).join('');
  const cnt = sufficient.length;
  const avgProb = totProb/cnt;
  const totGapTxt = totGap>=0 ? '<span class="pr-up">超'+totGap.toFixed(0)+'</span>' : '<span class="pr-down">差'+(-totGap).toFixed(0)+'</span>';
  const totalRow = '<div class="pr-row pr-total"><span class="pr-name">总分</span><span class="pr-score">'+totP.toFixed(0)+'</span>'+totGapTxt+'<span style="flex:none;width:130px;display:inline-block"></span><span class="pr-prob">'+(avgProb*100).toFixed(0)+'%</span><span class="pr-tag '+(avgProb>=0.8?'ok':avgProb>=0.5?'warn':'bad')+'">总体</span></div>';
  box.innerHTML = rows + totalRow;
}

// ---------- 关键时间节点 ----------
function renderTimeline(){
  const box = document.getElementById("timeline");
  if(!box) return;
  const now = new Date(); now.setHours(0,0,0,0);
  // 找最临近的未过节点（用于高亮）
  let nextIdx = -1;
  for(let i=0;i<MILESTONES.length;i++){
    const d = new Date(MILESTONES[i].date + "T00:00:00");
    if(d >= now){ nextIdx = i; break; }
  }
  box.innerHTML = MILESTONES.map(function(m, i){
    const d = new Date(m.date + "T00:00:00");
    const diff = Math.round((d - now)/86400000);
    let cls = "row", cd;
    if(diff < 0){ cls += " past"; cd = "已结束"; }
    else if(i === nextIdx){ cls += " next"; cd = (diff===0 ? "今天" : ("剩"+diff+"天")); }
    else { cd = (diff===0 ? "今天" : ("剩"+diff+"天")); }
    return '<div class="'+cls+'">'+
      '<span class="nm">'+m.name+'</span>'+
      '<span class="meta">'+
        '<span class="dt">'+m.label+'</span>'+
        '<span class="cd">'+cd+'</span>'+
      '</span>'+
    '</div>';
  }).join("");
}

// ---------- 初始化 ----------
curWeekIdx = Math.max(0, weekOf(curDate));
boot();
